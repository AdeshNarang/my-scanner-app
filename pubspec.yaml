name: an_office
description: AN Office - Executive Document & Productivity Studio by Adesh Narang.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Offline AI Document Scanner & Bilingual OCR (Latin + Devanagari)
  google_mlkit_document_scanner: ^0.2.1
  google_mlkit_text_recognition: ^0.13.0

  # PDF Engine, Viewer & Wireless Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Camera, Manual Cropper & Tiered Compression
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0

  # Office Document Engines (Excel .xlsx & Word .docx / Zip)
  excel: ^4.0.3
  archive: ^3.4.10

  # Storage, Sharing, System Intents & Utilities
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.2
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
