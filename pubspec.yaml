name: an_office
description: "AN Office - Executive Document Workstation & AI Studio"
publish_to: "none"
version: 10.0.5+35

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Document Formats & PDF Core
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0

  # AI & Vision
  google_mlkit_document_scanner: ^0.2.0
  google_mlkit_text_recognition: ^0.13.0

  # Image & File Processing
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  open_filex: ^4.5.0
  share_plus: ^10.1.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Connectivity & Storage
  google_sign_in: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
