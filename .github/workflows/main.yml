name: Build AN Office Production APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Project & Preserve Source
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png /tmp/user_logo.png
          fi
          rm -rf android ios test web linux macos windows pubspec.lock .dart_tool
          flutter create --platforms=android --org com.adeshnarang --project-name an_office .
          mkdir -p assets
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          if [ -f "/tmp/user_logo.png" ]; then
            cp /tmp/user_logo.png assets/logo.png
          fi

      - name: Generate AN OFFICE Classical Crest Logo & Android Mipmaps
        run: |
          sudo apt-get update -y && sudo apt-get install -y python3-pil imagemagick
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          if os.path.exists("assets/logo.png"):
              base_img = Image.open("assets/logo.png").convert("RGBA")
              base_img = base_img.resize((512, 512), Image.Resampling.LANCZOS)
          else:
              size = 512
              base_img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(base_img)
              ivory = (242, 239, 233, 255)
              charcoal = (45, 42, 38, 255)
              pewter = (95, 90, 84, 255)

              draw.rounded_rectangle([14, 14, size-14, size-14], radius=98, fill=ivory, outline=pewter, width=5)

              cx, cy = size // 2, size // 2
              r_out, r_in = 208, 196
              draw.ellipse([cx - r_out, cy - r_out, cx + r_out, cy + r_out], outline=charcoal, width=4)
              draw.ellipse([cx - r_in, cy - r_in, cx + r_in, cy + r_in], outline=pewter, width=2)

              for pt in [(cx, cy - r_out - 6), (cx, cy + r_out + 6), (cx - r_out - 6, cy), (cx + r_out + 6, cy)]:
                  draw.ellipse([pt[0]-9, pt[1]-9, pt[0]+9, pt[1]+9], fill=charcoal)

              draw.polygon([(176, 138), (118, 306), (146, 306), (190, 170)], fill=charcoal)
              draw.polygon([(176, 138), (238, 306), (210, 306), (168, 170)], fill=charcoal)
              draw.rectangle([138, 240, 212, 256], fill=pewter)
              draw.rectangle([106, 300, 156, 310], fill=charcoal)
              draw.rectangle([198, 300, 248, 310], fill=charcoal)

              draw.rectangle([258, 150, 282, 308], fill=charcoal)
              draw.polygon([(258, 150), (284, 150), (380, 286), (356, 308)], fill=charcoal)
              draw.rectangle([358, 150, 380, 308], fill=charcoal)
              draw.rectangle([244, 145, 294, 155], fill=charcoal)
              draw.rectangle([344, 145, 392, 155], fill=charcoal)
              draw.rectangle([244, 300, 296, 310], fill=charcoal)

              lx, ly, lr = 248, 244, 34
              draw.ellipse([lx - lr - 6, ly - lr - 6, lx + lr + 6, ly + lr + 6], fill=charcoal)
              draw.ellipse([lx - lr + 4, ly - lr + 4, lx + lr - 4, ly + lr - 4], fill=ivory, outline=pewter, width=3)
              draw.polygon([(lx + 22, ly + 26), (lx + 34, ly + 16), (lx + 70, ly + 52), (lx + 56, ly + 64)], fill=charcoal)

              y_top = 342
              draw.ellipse([142, y_top, 178, y_top+42], outline=charcoal, width=8)
              draw.rectangle([190, y_top, 198, y_top+42], fill=charcoal)
              draw.rectangle([190, y_top, 218, y_top+8], fill=charcoal)
              draw.rectangle([190, y_top+18, 212, y_top+25], fill=charcoal)
              draw.rectangle([228, y_top, 236, y_top+42], fill=charcoal)
              draw.rectangle([228, y_top, 256, y_top+8], fill=charcoal)
              draw.rectangle([228, y_top+18, 250, y_top+25], fill=charcoal)
              draw.rectangle([268, y_top, 276, y_top+42], fill=charcoal)
              draw.arc([290, y_top, 326, y_top+42], start=45, end=315, fill=charcoal, width=8)
              draw.rectangle([338, y_top, 346, y_top+42], fill=charcoal)
              draw.rectangle([338, y_top, 368, y_top+8], fill=charcoal)
              draw.rectangle([338, y_top+18, 362, y_top+25], fill=charcoal)
              draw.rectangle([338, y_top+34, 368, y_top+42], fill=charcoal)

              base_img.save("assets/logo.png")

          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              base_img.resize((px, px), Image.Resampling.LANCZOS).save(f"{out_dir}/ic_launcher.png")
          EOF

      - name: Configure Native Kotlin Intent Interceptor
        run: |
          rm -rf android/app/src/main/kotlin/in
          mkdir -p android/app/src/main/kotlin/com/adeshnarang/an_office
          cat << 'EOF' > android/app/src/main/kotlin/com/adeshnarang/an_office/MainActivity.kt
          package com.adeshnarang.an_office

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.adeshnarang.an_office/intent"
              private var pendingFilePath: String? = null
              private var methodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "getInitialFile") {
                          result.success(pendingFilePath)
                          pendingFilePath = null
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleIncomingIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleIncomingIntent(intent)
              }

              private fun handleIncomingIntent(intent: Intent?) {
                  if (intent == null) return
                  val action = intent.action
                  var targetUri: Uri? = null

                  if (Intent.ACTION_VIEW == action) {
                      targetUri = intent.data
                  } else if (Intent.ACTION_SEND == action) {
                      @Suppress("DEPRECATION")
                      targetUri = intent.getParcelableExtra(Intent.EXTRA_STREAM) as? Uri
                  }

                  if (targetUri != null) {
                      val copiedPath = copyUriToInternalCache(targetUri)
                      if (copiedPath != null) {
                          pendingFilePath = copiedPath
                          methodChannel?.invokeMethod("onIncomingFile", copiedPath)
                      }
                  }
              }

              private fun copyUriToInternalCache(uri: Uri): String? {
                  return try {
                      var fileName = "Document_${System.currentTimeMillis()}.pdf"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIndex != -1 && cursor.moveToFirst()) {
                              val rawName = cursor.getString(nameIndex)
                              if (!rawName.isNullOrBlank()) {
                                  fileName = rawName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                              }
                          }
                      }
                      val outDir = File(cacheDir, "incoming_intents")
                      if (!outDir.exists()) outDir.mkdirs()
                      val outFile = File(outDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(outFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

      - name: Patch Gradle & ProGuard for SDK 35 + ML Kit Document Scanner & Devanagari OCR
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.adeshnarang.an_office"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.adeshnarang.an_office"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 31
                  versionName = "10.0.1"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation "com.google.mlkit:text-recognition-devanagari:16.0.0"
              implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure AndroidManifest.xml for AN Office
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="AN Office"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Clean Build Cache & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload AN Office Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Office-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
