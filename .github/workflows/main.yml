name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Initialize Complete Flutter Project
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --org com.example --project-name my_scanner_app .
          cp -r android ../
          cd ..
          rm -rf temp_build
          flutter pub add google_mlkit_document_scanner open_file path_provider

      - name: Build Release APK with Android SDK 35
        run: flutter build apk --release --dart-define=flutter.compileSdkVersion=35 --dart-define=flutter.minSdkVersion=21 || flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Scanner-App
          path: build/app/outputs/flutter-apk/app-release.apk
