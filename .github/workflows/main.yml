name: Build AN Scan Production APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Project & Preserve Source
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png /tmp/user_logo.png
          fi
          rm -rf android ios test web linux macos windows pubspec.lock .dart_tool
          flutter create --platforms=android --org in.adeshnarang --project-name an_scan .
          mkdir -p assets
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          if [ -f "/tmp/user_logo.png" ]; then
            cp /tmp/user_logo.png assets/logo.png
          fi

      - name: Generate Classical AN Scan Logo & All Android Mipmaps
        run: |
          sudo apt-get update -y && sudo apt-get install -y python3-pil imagemagick
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          # If user uploaded assets/logo.png, use it; otherwise synthesize the Classical Ivory/Bronze AN Scan Crest
          if os.path.exists("assets/logo.png"):
              base_img = Image.open("assets/logo.png").convert("RGBA")
              base_img = base_img.resize((512, 512), Image.Resampling.LANCZOS)
          else:
              size = 512
              base_img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(base_img)

              # Rounded Ivory Parchment Square Background (#F5F2EB)
              ivory = (245, 242, 235, 255)
              bronze_dark = (58, 50, 42, 255)
              bronze_mid = (110, 94, 77, 255)
              gold_tint = (168, 142, 105, 255)

              draw.rounded_rectangle([16, 16, size-16, size-16], radius=96, fill=ivory, outline=bronze_mid, width=6)

              # Classical Double Filigree Circular Crest
              cx, cy = size // 2, size // 2
              r_outer = 205
              r_inner = 193
              draw.ellipse([cx - r_outer, cy - r_outer, cx + r_outer, cy + r_outer], outline=bronze_dark, width=5)
              draw.ellipse([cx - r_inner, cy - r_inner, cx + r_inner, cy + r_inner], outline=bronze_mid, width=3)

              # Cardinal Ornate Filigree Accents
              for angle_pt in [(cx, cy - r_outer - 6), (cx, cy + r_outer + 6), (cx - r_outer - 6, cy), (cx + r_outer + 6, cy)]:
                  ax, ay = angle_pt
                  draw.ellipse([ax - 8, ay - 8, ax + 8, ay + 8], fill=bronze_dark, outline=gold_tint, width=2)

              # Draw Classical Interlocking 'A' and 'N' Monogram
              # Left Leg of A
              draw.polygon([(175, 145), (120, 310), (146, 310), (188, 175)], fill=bronze_dark)
              # Right Leg of A
              draw.polygon([(175, 145), (235, 310), (207, 310), (168, 175)], fill=bronze_dark)
              # Crossbar of A
              draw.rectangle([140, 245, 212, 262], fill=bronze_mid)
              # Serif Caps for A
              draw.rectangle([108, 304, 156, 314], fill=bronze_dark)
              draw.rectangle([196, 304, 246, 314], fill=bronze_dark)
              draw.rectangle([156, 140, 194, 150], fill=bronze_dark)

              # Left Stem of N
              draw.rectangle([258, 155, 282, 312], fill=bronze_dark)
              # Diagonal of N
              draw.polygon([(258, 155), (284, 155), (378, 290), (354, 312)], fill=bronze_dark)
              # Right Stem of N
              draw.rectangle([356, 155, 378, 312], fill=bronze_dark)
              # Serif Caps for N
              draw.rectangle([244, 150, 294, 160], fill=bronze_dark)
              draw.rectangle([342, 150, 392, 160], fill=bronze_dark)
              draw.rectangle([244, 304, 296, 314], fill=bronze_dark)

              # Integrated Optical Magnifying Lens in Center
              lx, ly, lr = 246, 250, 36
              draw.ellipse([lx - lr - 6, ly - lr - 6, lx + lr + 6, ly + lr + 6], fill=bronze_dark, outline=gold_tint, width=3)
              draw.ellipse([lx - lr + 4, ly - lr + 4, lx + lr - 4, ly + lr - 4], fill=ivory, outline=bronze_mid, width=3)
              # Magnifier Handle
              draw.polygon([(lx + 24, ly + 28), (lx + 36, ly + 18), (lx + 72, ly + 56), (lx + 58, ly + 68)], fill=bronze_dark)

              # Draw 'SCAN' Classical Footer Text
              # S C A N geometric block serifs
              y_top = 345
              # S
              draw.rectangle([170, y_top, 202, y_top+8], fill=bronze_dark)
              draw.rectangle([170, y_top, 178, y_top+22], fill=bronze_dark)
              draw.rectangle([170, y_top+18, 202, y_top+26], fill=bronze_dark)
              draw.rectangle([194, y_top+18, 202, y_top+44], fill=bronze_dark)
              draw.rectangle([170, y_top+36, 202, y_top+44], fill=bronze_dark)
              # C
              draw.rectangle([218, y_top, 250, y_top+8], fill=bronze_dark)
              draw.rectangle([218, y_top, 226, y_top+44], fill=bronze_dark)
              draw.rectangle([218, y_top+36, 250, y_top+44], fill=bronze_dark)
              # A
              draw.polygon([(278, y_top), (262, y_top+44), (271, y_top+44), (282, y_top+10)], fill=bronze_dark)
              draw.polygon([(278, y_top), (296, y_top+44), (287, y_top+44), (276, y_top+10)], fill=bronze_dark)
              draw.rectangle([267, y_top+26, 290, y_top+33], fill=bronze_dark)
              # N
              draw.rectangle([310, y_top, 318, y_top+44], fill=bronze_dark)
              draw.polygon([(310, y_top), (319, y_top), (344, y_top+36), (336, y_top+44)], fill=bronze_dark)
              draw.rectangle([336, y_top, 344, y_top+44], fill=bronze_dark)

              base_img.save("assets/logo.png")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              resized = base_img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(f"{out_dir}/ic_launcher.png")
          EOF

      - name: Configure Native Kotlin Intent Interceptor (Fixes Gmail / Open-With Bug)
        run: |
          mkdir -p android/app/src/main/kotlin/in/adeshnarang/an_scan
          cat << 'EOF' > android/app/src/main/kotlin/in/adeshnarang/an_scan/MainActivity.kt
          package in.adeshnarang.an_scan

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "in.adeshnarang.an_scan/intent"
              private var pendingFilePath: String? = null
              private var methodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "getInitialFile") {
                          result.success(pendingFilePath)
                          pendingFilePath = null
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleIncomingIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleIncomingIntent(intent)
              }

              private fun handleIncomingIntent(intent: Intent?) {
                  if (intent == null) return
                  val action = intent.action
                  var targetUri: Uri? = null

                  if (Intent.ACTION_VIEW == action) {
                      targetUri = intent.data
                  } else if (Intent.ACTION_SEND == action) {
                      @Suppress("DEPRECATION")
                      targetUri = intent.getParcelableExtra(Intent.EXTRA_STREAM) as? Uri
                  }

                  if (targetUri != null) {
                      val copiedPath = copyUriToInternalCache(targetUri)
                      if (copiedPath != null) {
                          pendingFilePath = copiedPath
                          methodChannel?.invokeMethod("onIncomingFile", copiedPath)
                      }
                  }
              }

              private fun copyUriToInternalCache(uri: Uri): String? {
                  return try {
                      var fileName = "Imported_${System.currentTimeMillis()}.pdf"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIndex != -1 && cursor.moveToFirst()) {
                              val rawName = cursor.getString(nameIndex)
                              if (!rawName.isNullOrBlank()) {
                                  fileName = rawName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                              }
                          }
                      }
                      val outDir = File(cacheDir, "incoming_intents")
                      if (!outDir.exists()) outDir.mkdirs()
                      val outFile = File(outDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(outFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

      - name: Patch Gradle & ProGuard for SDK 35 + ML Kit
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn javax.annotation.**
          -keep class androidx.lifecycle.** { *; }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "in.adeshnarang.an_scan"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "in.adeshnarang.an_scan"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 25
                  versionName = "9.0.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure AndroidManifest.xml (All Document MIME Intents)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage"/>

              <application
                  android:label="AN Scan"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <!-- Open With Intent Filter for PDFs, Word, Excel, CSV, TXT, Images -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>

                      <!-- Share To Intent Filter -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Clean Build Cache & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload AN Scan Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Scan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
