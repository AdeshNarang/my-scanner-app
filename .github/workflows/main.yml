name: Build AN Office APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Classical AN Office Home Screen Icon & Configure Android
        run: |
          # 1. Safeguard any icon casing in main.dart
          sed -i 's/Icons.Auto_awesome_motion_outlined/Icons.auto_awesome_motion_outlined/g' lib/main.dart

          # 2. Generate 1024x1024 Classical Executive "AN Office" Home Screen Logo
          cat << 'EOF' > generate_assets.dart
          import 'dart:io';
          import 'package:image/image.dart' as img;

          void main() {
            final canvas = img.Image(width: 1024, height: 1024);
            final slateBg = img.ColorRgba8(15, 23, 42, 255);      // #0F172A Deep Executive Slate
            final tealBorder = img.ColorRgba8(0, 128, 128, 255);  // #008080 Classic Teal
            final brightTeal = img.ColorRgba8(45, 212, 191, 255); // #2DD4BF Monogram Accent
            final white = img.ColorRgba8(248, 249, 253, 255);

            img.fill(canvas, color: slateBg);

            // Outer & Inner Classic Executive Frame
            img.drawRect(canvas, x1: 64, y1: 64, x2: 960, y2: 960, color: tealBorder, thickness: 28);
            img.drawRect(canvas, x1: 104, y1: 104, x2: 920, y2: 920, color: brightTeal, thickness: 6);

            // Draw Geometric "A" (Left Side)
            img.drawLine(canvas, x1: 335, y1: 260, x2: 200, y2: 720, color: brightTeal, thickness: 52);
            img.drawLine(canvas, x1: 335, y1: 260, x2: 470, y2: 720, color: brightTeal, thickness: 52);
            img.fillRect(canvas, x1: 245, y1: 530, x2: 425, y2: 580, color: brightTeal);

            // Draw Geometric "N" (Right Side)
            img.fillRect(canvas, x1: 540, y1: 260, x2: 595, y2: 720, color: white);
            img.drawLine(canvas, x1: 565, y1: 275, x2: 795, y2: 705, color: white, thickness: 52);
            img.fillRect(canvas, x1: 765, y1: 260, x2: 820, y2: 720, color: white);

            // Bottom Accent Bar
            img.fillRect(canvas, x1: 312, y1: 800, x2: 712, y2: 824, color: tealBorder);

            File('app_icon.png').writeAsBytesSync(img.encodePng(canvas));

            // 3. Rename Home Screen Label to "AN Office" in AndroidManifest.xml
            final manifestFile = File('android/app/src/main/AndroidManifest.xml');
            if (manifestFile.existsSync()) {
              var content = manifestFile.readAsStringSync();
              content = content.replaceAll(RegExp(r'android:label="[^"]*"'), 'android:label="AN Office"');
              manifestFile.writeAsStringSync(content);
            }
          }
          EOF
          dart run generate_assets.dart
          rm generate_assets.dart

          # 4. Apply the Generated Icon to All Android Home Screen Resolutions
          if ! grep -q "flutter_launcher_icons:" pubspec.yaml; then
          cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "app_icon.png"
            adaptive_icon_background: "#0F172A"
            adaptive_icon_foreground: "app_icon.png"
          EOF
          fi
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload AN Office APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Office-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
