name: Build AN Office APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create Missing Flutter Scaffold (if only 3 files exist in repo)
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml pubspec.yaml.bak
            cp lib/main.dart lib/main.dart.bak
            flutter create --org in.adeshnarang --project-name an_office .
            mv pubspec.yaml.bak pubspec.yaml
            mv lib/main.dart.bak lib/main.dart
          fi

      - name: Generate Classic AN Monogram App Icon
        run: |
          mkdir -p assets
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024, 1024), (15, 23, 42, 255))
          draw = ImageDraw.Draw(img)
          # Gold/Executive Border
          draw.rounded_rectangle([80, 80, 944, 944], radius=180, outline=(212, 175, 55, 255), width=28)
          draw.rounded_rectangle([120, 120, 904, 904], radius=150, outline=(255, 255, 255, 60), width=8)
          # Draw Clean Geometric "AN" Monogram
          # Letter A
          draw.polygon([(310, 720), (420, 300), (480, 300), (590, 720), (520, 720), (450, 420), (380, 720)], fill=(255, 255, 255, 255))
          draw.rectangle([365, 560, 535, 610], fill=(212, 175, 55, 255))
          # Letter N
          draw.rectangle([620, 300, 685, 720], fill=(255, 255, 255, 255))
          draw.polygon([(620, 300), (685, 300), (830, 720), (765, 720)], fill=(212, 175, 55, 255))
          draw.rectangle([765, 300, 830, 720], fill=(255, 255, 255, 255))
          img.save('assets/icon.png')
          EOF

      - name: Patch Android Build Config & ProGuard Rules (Fixes R8 & SDK Errors)
        run: |
          # 1. Create ProGuard rules to ignore missing ML Kit optional language modules
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -keep class androidx.lifecycle.** { *; }
          EOF

          # 2. Force compileSdk 35, minSdk 24, MultiDex in android/app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "in.adeshnarang.an_office"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "in.adeshnarang.an_office"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Patch AndroidManifest.xml (Permissions, UCrop & File Viewer Intents)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage"/>

              <application
                  android:label="AN Office"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <!-- Native File Viewer Intent Filters (PDF, Word, Excel, Text) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <!-- Required for Image Cropper -->
                  <activity
                      android:name="com.yalantis.ucrop.UCropActivity"
                      android:screenOrientation="portrait"
                      android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Install Dependencies & Generate Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK (Bypassing R8 Shrink Crash)
        run: |
          flutter build apk --release --no-shrink

      - name: Upload AN Office APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AN-Office-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
