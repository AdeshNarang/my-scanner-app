name: Build AN Office Production APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Project & Preserve Lib & Assets
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          mkdir -p /tmp/assets_backup
          if [ -d "assets" ]; then
            cp -r assets/* /tmp/assets_backup/ || true
          fi
          rm -rf android ios test web linux macos windows pubspec.lock .dart_tool
          flutter create --platforms=android --org com.adeshnarang --project-name an_office .
          mkdir -p assets/tessdata
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp -r /tmp/assets_backup/* assets/ || true

      - name: Download Tesseract Punjabi (Gurmukhi) Model
        run: |
          mkdir -p assets/tessdata
          curl -L -o assets/tessdata/pan.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/pan.traineddata
          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "pan.traineddata"
            ]
          }
          EOF

      - name: Generate Permanent Keystore & Print SHA-1 Fingerprint
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.keystore -alias anoffice -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "anoffice123" -keypass "anoffice123" -dname "CN=Adesh Narang, OU=AN Office, O=AN Office, L=Moga, ST=Punjab, C=IN"
          
          echo "=========================================================="
          echo "=== PERMANENT GOOGLE OAUTH SHA-1 CERTIFICATE FINGERPRINT ==="
          keytool -list -v -keystore android/app/release.keystore -alias anoffice -storepass "anoffice123" | grep "SHA1:"
          echo "=========================================================="

      - name: Generate Launcher Mipmaps Strictly From User Logo
        run: |
          sudo apt-get update -y && sudo apt-get install -y python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_path = "assets/logo.png"
          if os.path.exists(logo_path):
              base_img = Image.open(logo_path).convert("RGBA")
          else:
              base_img = Image.new("RGBA", (512, 512), (15, 23, 42, 255))
              os.makedirs("assets", exist_ok=True)
              base_img.save(logo_path)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, px in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              base_img.resize((px, px), Image.Resampling.LANCZOS).save(f"{out_dir}/ic_launcher.png")
          EOF

      - name: Configure Native Intent Interceptor
        run: |
          rm -rf android/app/src/main/kotlin/in
          mkdir -p android/app/src/main/kotlin/com/adeshnarang/an_office
          cat << 'EOF' > android/app/src/main/kotlin/com/adeshnarang/an_office/MainActivity.kt
          package com.adeshnarang.an_office

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.adeshnarang.an_office/intent"
              private var pendingFilePath: String? = null
              private var methodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "getInitialFile") {
                          result.success(pendingFilePath)
                          pendingFilePath = null
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleIncomingIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleIncomingIntent(intent)
              }

              private fun handleIncomingIntent(intent: Intent?) {
                  if (intent == null) return
                  val action = intent.action
                  var targetUri: Uri? = null

                  if (Intent.ACTION_VIEW == action) {
                      targetUri = intent.data
                  } else if (Intent.ACTION_SEND == action) {
                      @Suppress("DEPRECATION")
                      targetUri = intent.getParcelableExtra(Intent.EXTRA_STREAM) as? Uri
                  }

                  if (targetUri != null) {
                      val copiedPath = copyUriToInternalCache(targetUri)
                      if (copiedPath != null) {
                          pendingFilePath = copiedPath
                          methodChannel?.invokeMethod("onIncomingFile", copiedPath)
                      }
                  }
              }

              private fun copyUriToInternalCache(uri: Uri): String? {
                  return try {
                      var fileName = "Document_${System.currentTimeMillis()}.pdf"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIndex != -1 && cursor.moveToFirst()) {
                              val rawName = cursor.getString(nameIndex)
                              if (!rawName.isNullOrBlank()) {
                                  fileName = rawName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                              }
                          }
                      }
                      val outDir = File(cacheDir, "incoming_intents")
                      if (!outDir.exists()) outDir.mkdirs()
                      val outFile = File(outDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(outFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

      - name: Configure Gradle Signing with Permanent Keystore
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class com.googlecode.tesseract.android.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.googlecode.tesseract.android.**
          EOF

          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo.maven.apache.org/maven2' }
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.adeshnarang.an_office"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'anoffice123'
                      keyAlias 'anoffice'
                      keyPassword 'anoffice123'
                  }
              }

              defaultConfig {
                  applicationId = "com.adeshnarang.an_office"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 39
                  versionName = "10.0.9"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation "com.google.mlkit:text-recognition-devanagari:16.0.0"
              implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure AndroidManifest.xml (intoExisting Single-Tab Stacking)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="AN Office"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:documentLaunchMode="intoExisting"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="text/tab-separated-values" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.ms-powerpoint" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Clean & Compile Release APK
        run: |
          flutter clean
          flutter pub get
          # Run Gradle build directly via Flutter CLI
          flutter build apk --release --no-shrink || (cd android && ./gradlew assembleRelease --no-daemon)
          # Guarantee the output APK is in the expected artifact path
          mkdir -p build/app/outputs/flutter-apk
          APK_FOUND=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "Located compiled APK at: $APK_FOUND"
            cp "$APK_FOUND" build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Office-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
