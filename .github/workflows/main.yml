name: Build AN Scan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Project Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          rm -rf android ios test web linux macos windows pubspec.lock .dart_tool
          flutter create --platforms=android --org in.adeshnarang --project-name an_scan .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

      - name: Patch Gradle & ProGuard for SDK 35 + ML Kit
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn javax.annotation.**
          -keep class androidx.lifecycle.** { *; }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "in.adeshnarang.an_scan"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "in.adeshnarang.an_scan"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 10
                  versionName = "5.0.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure AndroidManifest.xml (Intents, File Viewer & Share Receiver)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage"/>

              <application
                  android:label="AN Scan"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <!-- Intent filter to intercept external PDFs/Files opened with AN Scan -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Process & Integrate Custom Logo into Android Mipmaps
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          # Expects logo file placed in repository root as assets/logo.png
          if [ ! -f "assets/logo.png" ]; then
            echo "Error: assets/logo.png not found! Please place your logo image in assets/logo.png"
            exit 1
          fi
          convert assets/logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Clean Build Cache & Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK (No R8 Shrink Crash)
        run: flutter build apk --release --no-shrink

      - name: Upload AN Scan Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Scan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
