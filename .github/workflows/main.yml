name: Build AN Office APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Project Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          rm -rf android ios test web linux macos windows pubspec.lock .dart_tool
          flutter create --platforms=android --org in.adeshnarang --project-name an_office .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

      - name: Patch Gradle & ProGuard for SDK 35 + ML Kit Latin/Devanagari
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn javax.annotation.**
          -keep class androidx.lifecycle.** { *; }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "in.adeshnarang.an_office"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "in.adeshnarang.an_office"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 9
                  versionName = "4.0.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure AndroidManifest.xml (Camera, Intents & File Viewer)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage"/>

              <application
                  android:label="AN Office"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="text/csv" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate AN Monogram Icon (Zero External Dependencies)
        run: |
          python3 - << 'EOF'
          import zlib, struct

          w, h = 256, 256
          navy = (15, 23, 42, 255)
          gold = (212, 175, 55, 255)
          white = (255, 255, 255, 255)

          grid = [[navy for _ in range(w)] for _ in range(h)]
          for y in range(20, 236):
              for x in range(20, 236):
                  if x < 30 or x >= 226 or y < 30 or y >= 226:
                      grid[y][x] = gold

          for y in range(75, 185):
              for x in range(55, 120):
                  if x < 70 or x >= 105 or (y < 90) or (122 <= y <= 136):
                      grid[y][x] = white if not (122 <= y <= 136) else gold

          for y in range(75, 185):
              for x in range(136, 201):
                  diag = 136 + int((y - 75) * (50.0 / 110.0))
                  if x < 151 or x >= 186:
                      grid[y][x] = white
                  elif diag <= x <= diag + 14:
                      grid[y][x] = gold

          raw = bytearray()
          for row in grid:
              raw.append(0)
              for r, g, b, a in row:
                  raw.extend((r, g, b, a))

          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)

          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              with open(f"android/app/src/main/res/{folder}/ic_launcher.png", "wb") as f:
                  f.write(png)
          EOF

      - name: Clean Build Cache & Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK (No R8 Shrink Crash)
        run: flutter build apk --release --no-shrink

      - name: Upload AN Office Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AN-Office-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
